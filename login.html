<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AuMigo - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="src/styles/login.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4 col-md-6">
        
        <div class="text-center">
            <img src="logo.png" class="logo">
            <h2 class="title">Cadastro AuMigo 🐾</h2>
            <p>Adote amor, adote um amigo ❤️</p>
        </div>

        <form action="salvar.php" method="POST">

            <div class="mb-3">
                <label>Nome completo</label>
                <input type="text" name="nome" class="form-control" placeholder="Digite seu nome">
            </div>

            <div class="mb-3">
                <label>Endereço</label>
                <input type="text" name="endereco" class="form-control" placeholder="Digite seu endereço">
            </div>

            <div class="mb-3">
                <label>Telefone</label>
                <input type="text" name="telefone" class="form-control" placeholder="(00) 00000-0000">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="seuemail@gmail.com">
            </div>

            <div class="mb-3">
                <label>CPF</label>
                <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00">
            </div>

            <div class="mb-3">


    <div class="mb-3">

    <label for="senha" class="form-label">Senha</label>

    <div class="senha-box">

        <input
            type="password"
            class="form-control"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required
        >

        <span id="mostrarSenha">
            <i class="fa-solid fa-eye"></i>
        </span>

    </div>

    <div class="senha-requisitos">

        <p class="titulo-requisitos">
            Sua senha deve conter:
        </p>

        <div class="item" id="r1">
            <i class="fa-regular fa-circle"></i>
            <span>Pelo menos 8 caracteres</span>
        </div>

        <div class="item" id="r2">
            <i class="fa-regular fa-circle"></i>
            <span>Uma letra maiúscula</span>
        </div>

        <div class="item" id="r3">
            <i class="fa-regular fa-circle"></i>
            <span>Uma letra minúscula</span>
        </div>

        <div class="item" id="r4">
            <i class="fa-regular fa-circle"></i>
            <span>Um número</span>
        </div>

        <div class="item" id="r5">
            <i class="fa-regular fa-circle"></i>
            <span>Um caractere especial</span>
        </div>

    </div>

</div>

            <button type="submit" class="btn btn-custom w-100">
                Criar Conta
            </button>

            <div class="text-center mt-3">
                <small>Já tem conta? <a href="entrar.html">Entrar</a></small>
            </div>

        </form>

    </div>

</div>
    <script>

const senha = document.getElementById("senha");

function validarSenha(){

    const regras = [
        senha.value.length >= 8,
        /[A-Z]/.test(senha.value),
        /[a-z]/.test(senha.value),
        /[0-9]/.test(senha.value),
        /[^A-Za-z0-9]/.test(senha.value)
    ];

    regras.forEach((ok,index)=>{

        let item = document.getElementById("r"+(index+1));

        if(ok){

            item.classList.add("ok");
            item.querySelector("i").className="fa-solid fa-circle-check";

        }else{

            item.classList.remove("ok");
            item.querySelector("i").className="fa-regular fa-circle";

        }

    });

}

senha.addEventListener("input", validarSenha);

document.getElementById("mostrarSenha").onclick=function(){

    if(senha.type=="password"){

        senha.type="text";
        this.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

    }else{

        senha.type="password";
        this.innerHTML='<i class="fa-solid fa-eye"></i>';

    }

}

</script>

</body>
</html>
